[tox]
envlist = 
    py311-django{42,52}-{sqlite,postgres,mysql}
    py312-django{42,52,60}-{sqlite,postgres,mysql}
    py{313,314}-django{52,60}-{sqlite,postgres,mysql}
    lint
    docs
skip_missing_interpreters = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
package = wheel
wheel_build_env = .pkg
passenv =
    DB_*
    COVERAGE_FILE
setenv =
    sqlite: DB_BACKEND=sqlite3
    sqlite: DB_NAME=:memory:
    postgres: DB_BACKEND=postgresql
    postgres: DB_NAME=django_migration_audit
    postgres: DB_USER=postgres
    postgres: DB_PASSWORD=postgres
    postgres: DB_HOST=localhost
    postgres: DB_PORT=5432
    mysql: DB_BACKEND=mysql
    mysql: DB_NAME=django_migration_audit
    mysql: DB_USER=root
    mysql: DB_PASSWORD=
    mysql: DB_HOST=localhost
    mysql: DB_PORT=3306
deps =
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<7.0
    postgres: psycopg2-binary>=2.9.0
    mysql: mysqlclient>=2.1.0
    pytest>=8.0.0
    pytest-django>=4.5.0
    pytest-cov>=4.1.0
    coverage[toml]>=7.0.0
commands =
    pytest --cov=django_migration_audit --cov-report=term-missing {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
commands =
    ruff check src

[testenv:format]
deps =
    ruff>=0.1.0
commands =
    ruff format src

[testenv:docs]
deps =
    sphinx>=7.0.0
    sphinx-autobuild>=2024.0.0
    doc8>=1.0.0
    myst-parser>=2.0.0
    sphinx-rtd-theme>=2.0.0
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:packaging]
deps =
    build>=0.10.0
    twine>=4.0.0
commands =
    python -m build
    twine check dist/*
