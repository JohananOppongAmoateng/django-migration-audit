name: Test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  schedule:
    # Run weekly on Saturday
    - cron: '37 3 * * SAT'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        django-version: ['42', '52', '60']
        exclude:
          - python-version: '3.11'
            django-version: '60'
          - python-version: '3.13'
            django-version: '42'
          - python-version: '3.14'
            django-version: '42'

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: django_migration_audit
        options: >-
          --health-cmd "mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      - name: Test with tox
        run: |
          # Remove dots from python version for tox env (3.11 -> 311)
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          TOX_ENVS=py${PY_VER}-django${{ matrix.django-version }}-mysql
          tox -e "$TOX_ENVS"
        env:
          DB_BACKEND: mysql
          DB_NAME: django_migration_audit
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          COVERAGE_FILE: .coverage.mysql.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mysql-${{ matrix.python-version }}-django-${{ matrix.django-version }}
          path: .coverage.mysql.${{ matrix.python-version }}*
          include-hidden-files: true

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        django-version: ['42', '52', '60']
        exclude:
          - python-version: '3.11'
            django-version: '60'
          - python-version: '3.13'
            django-version: '42'
          - python-version: '3.14'
            django-version: '42'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_migration_audit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      - name: Test with tox
        run: |
          # Remove dots from python version for tox env (3.11 -> 311)
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          TOX_ENVS=py${PY_VER}-django${{ matrix.django-version }}-postgres
          tox -e "$TOX_ENVS"
        env:
          DB_BACKEND: postgresql
          DB_NAME: django_migration_audit
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          COVERAGE_FILE: .coverage.postgresql.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v4
        with:
          name: coverage-postgresql-${{ matrix.python-version }}-django-${{ matrix.django-version }}
          path: .coverage.postgresql.${{ matrix.python-version }}*
          include-hidden-files: true

  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        django-version: ['42', '52', '60']
        exclude:
          - python-version: '3.11'
            django-version: '60'
          - python-version: '3.13'
            django-version: '42'
          - python-version: '3.14'
            django-version: '42'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox tox-gh-actions

      - name: Test with tox
        run: |
          # Remove dots from python version for tox env (3.11 -> 311)
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          TOX_ENVS=py${PY_VER}-django${{ matrix.django-version }}-sqlite
          tox -e "$TOX_ENVS"
        env:
          DB_BACKEND: sqlite3
          DB_NAME: ":memory:"
          COVERAGE_FILE: .coverage.sqlite.${{ matrix.python-version }}

      - name: Store coverage file
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite-${{ matrix.python-version }}-django-${{ matrix.django-version }}
          path: .coverage.sqlite.${{ matrix.python-version }}*
          include-hidden-files: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs:
      - mysql
      - postgres
      - sqlite
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v4
        id: download
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
